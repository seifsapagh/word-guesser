<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordyl</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script type="module" src="script/main.js"></script>
    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/keyboard.css">
    <link rel="stylesheet" href="styles/overlay.css">
    <link rel="stylesheet" href="styles/animations.css">
    
</head>
<body>

    <section class="title-bar">
        <div class="btn-guide">
            <svg  xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-question-circle" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286m1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94"/>
            </svg>
        </div>

        <div class="title">
            <div class="right">w</div>
            <div>o</div>
            <div>r</div>
            <div>d</div>
            <div class="wrong">y</div>
            <div class="misplaced">l</div>
        </div>

        <div class="btn-new-game">
            <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="256" height="256" viewBox="0 0 256 256" xml:space="preserve">
                <g style="stroke: none; stroke-width: 0; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: none; fill-rule: nonzero; opacity: 1;" transform="translate(1.4065934065934016 1.4065934065934016) scale(2.81 2.81)">
                    <path d="M 75.702 53.014 c -2.142 7.995 -7.27 14.678 -14.439 18.816 c -7.168 4.138 -15.519 5.239 -23.514 3.095 c -16.505 -4.423 -26.335 -21.448 -21.913 -37.953 C 20.258 20.467 37.286 10.64 53.79 15.06 c 4.213 1.129 8.076 3.118 11.413 5.809 l -8.349 8.35 h 26.654 V 2.565 l -8.354 8.354 c -5.1 -4.405 -11.133 -7.61 -17.74 -9.381 C 33.451 -4.882 8.735 9.389 2.314 33.35 c -6.42 23.961 7.851 48.678 31.811 55.098 C 38.001 89.486 41.934 90 45.842 90 c 7.795 0 15.488 -2.044 22.42 -6.046 c 10.407 -6.008 17.851 -15.709 20.962 -27.317 L 75.702 53.014 z" style="stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: currentColor; fill-rule: nonzero; opacity: 1;" transform=" matrix(1 0 0 1 0 0) " stroke-linecap="round"/>
                </g>
            </svg>
        </div>

    </section>

    <section class="game">
      <div class="msg-overlay hidden">
        <div class="message"> </div>
      </div>
        <div class="user-tries">
           <!-- Added Dynamically  -->
        </div>

    </section>
    <section class="keyboard">
        <!-- 
            keyboard-row
                key key key
            keyboardRow
                key key key
            keyboardRow
                key key key
        -->
    </section>
<section class="overlay ">
  <div class="overlay-content">
    <div class="panel guide ">
      <h1>How to play Wordyl</h1>

      <!-- Step 1: User enters a guess -->
      <div class="guide-step">
        <p>Type a 5-letter word:</p>
        <div class="wordbox">
          <div class="flip-box">
            <div class="flip-inner">
              <div class="flip-front">H</div>
              <div class="flip-back right">H</div>
            </div>
          </div>
          <div class="flip-box">
            <div class="flip-inner">
              <div class="flip-front">E</div>
              <div class="flip-back misplaced">E</div>
            </div>
          </div>
          <div class="flip-box">
            <div class="flip-inner">
              <div class="flip-front">L</div>
              <div class="flip-back wrong">L</div>
            </div>
          </div>
          <div class="flip-box">
            <div class="flip-inner">
              <div class="flip-front">L</div>
              <div class="flip-back wrong">L</div>
            </div>
          </div>
          <div class="flip-box">
            <div class="flip-inner">
              <div class="flip-front">O</div>
              <div class="flip-back misplaced">O</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Step 2: Explain colors -->
      <div class="legend">
        <div><span class="tile right">H</span>  Correct position</div>
        <div><span class="tile misplaced">O</span>  Wrong position</div>
        <div><span class="tile wrong">L</span>  Not in word</div>
      </div>

      <p class="final-note">You have 5 tries to guess the word. Good luck!</p>
    </div>

  <div class="panel settings">
    <h1>Settings</h1>

    <div class="setting">
      <label  class="setting-label" for="word-length-slider"> Word Length </label>
      <div class="slider_container">
        <input
          type="range"
          id="word-length-slider"
          min="3"
          max="7"
          value="5"
          oninput="document.querySelector('#word-length-val').textContent = this.value"
        >
        <span id="word-length-val">5</span>
      </div>
    </div>

    <div class="setting">
      <label  class="setting-label" for="max-guesses-slider">Number of Guesses </label>
      <div class="slider_container">
        <input 
          type="range"
          id="max-guesses-slider"
          min="1"
          max="10"
          value="5"
          oninput="document.querySelector('#max-guesses-val').textContent = this.value"
        >
        <span id="max-guesses-val">5</span>
      </div>
    </div>
  </div>
  </div>
</section>

</body>
</html>
